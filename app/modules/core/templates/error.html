{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1"><i class="fas fa-exclamation-triangle me-2"></i>{{ error_title or '发生错误' }}</h4>
            <p class="mb-0 opacity-75">{{ error_message or '操作未能完成，请稍后重试。' }}</p>
        </div>
    </div>
</div>

<div style="max-width: 680px;">
    <div class="card">
        <div class="card-body">
            <div class="alert alert-danger mb-3">
                <i class="fas fa-exclamation-circle me-2"></i>
                <strong>{{ error_title or '错误' }}</strong>：{{ error_message or '发生了未知错误，请稍后重试。' }}
            </div>

            {% if error_details %}
            <div class="mt-3">
                <p class="fw-semibold mb-2" style="font-size: 0.85rem; color: var(--text-secondary);">错误详情：</p>
                <pre class="p-3 rounded" style="background: var(--bg-secondary); color: var(--text-secondary); font-size: 0.82rem; border: 1px solid var(--border-color); overflow-x: auto;">{{ error_details }}</pre>
            </div>
            {% endif %}

            <div class="mt-4">
                <a href="{{ url_for('core.page_select_group') }}" class="btn btn-primary">
                    <i class="fas fa-arrow-left me-2"></i>返回群组列表
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
