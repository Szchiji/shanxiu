{% extends "base.html" %}
{% from "components.html" import toast_notification, loading_spinner %}
{% block content %}
{{ toast_notification() }}
{{ loading_spinner() }}

<style>
    .page-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 1.5rem 2rem;
        border-radius: 15px;
        margin-bottom: 2rem;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }
    
    .settings-card {
        border-radius: 15px;
        border: none;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
    }
    
    .settings-card:hover {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        transform: translateY(-2px);
    }
    
    .form-switch .form-check-input {
        width: 3em;
        height: 1.5em;
        cursor: pointer;
    }
    
    .form-switch .form-check-input:checked {
        background-color: #667eea;
        border-color: #667eea;
    }
</style>

<div class="page-header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0"><i class="fa-solid fa-user-plus me-2"></i>邀请活动</h4>
            <p class="mb-0 opacity-75">{{ group.title }}</p>
        </div>
        <button class="btn btn-light fw-bold" onclick="saveSettings()">
            <i class="fa-solid fa-save me-2"></i>保存设置
        </button>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="settings-card card">
            <div class="card-header bg-white fw-bold py-3">
                <i class="fa-solid fa-gift me-2 text-primary"></i>邀请活动设置
            </div>
            <div class="card-body">
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="enabled" 
                           {{ 'checked' if settings and settings.enabled }}>
                    <label class="fw-bold">启用邀请活动</label>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">每邀请一人获得积分</label>
                    <input type="number" class="form-control" id="reward_points" 
                           value="{{ settings.reward_points if settings else 10 }}" 
                           placeholder="默认: 10">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">最少邀请人数</label>
                    <input type="number" class="form-control" id="minimum_invites" 
                           value="{{ settings.minimum_invites if settings else 1 }}" 
                           placeholder="默认: 1">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">活动开始时间</label>
                    <input type="datetime-local" class="form-control" id="activity_start" 
                           value="{{ settings.activity_start.strftime('%Y-%m-%dT%H:%M') if settings and settings.activity_start else '' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">活动结束时间</label>
                    <input type="datetime-local" class="form-control" id="activity_end" 
                           value="{{ settings.activity_end.strftime('%Y-%m-%dT%H:%M') if settings and settings.activity_end else '' }}">
                </div>
                
                <div class="mb-0">
                    <label class="form-label">活动说明</label>
                    <textarea class="form-control" id="description" rows="3" 
                              placeholder="输入活动规则和说明">{{ settings.description if settings and settings.description else '' }}</textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function saveSettings() {
    const data = {
        group_id: {{ group.id }},
        enabled: document.getElementById('enabled').checked,
        reward_points: parseInt(document.getElementById('reward_points').value) || 10,
        minimum_invites: parseInt(document.getElementById('minimum_invites').value) || 1,
        activity_start: document.getElementById('activity_start').value || null,
        activity_end: document.getElementById('activity_end').value || null,
        description: document.getElementById('description').value
    };
    
    fetch('/core/api/save_invitation_activity', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if (result.status === 'ok') {
            showToast('保存成功！'', 'success');
        } else {
            alert('❌ ' + (result.msg || '保存失败'));
        }
    })
    .catch(err => {
        console.error(err);
        showToast('网络错误'', 'error');
    });
}
</script>
{% endblock %}
