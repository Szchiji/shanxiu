<!-- Unified Pagination Component -->
{% macro pagination(current_page, total_pages, per_page, total_items, page_name='page', per_page_options=[10, 20, 50, 100]) %}
<style>
    .pagination-container {
        background: var(--bg-card);
        border-radius: 10px;
        padding: 1rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        margin-top: 1rem;
        border: 1px solid var(--border-color);
    }
    
    .pagination-info {
        font-size: 0.875rem;
        color: var(--text-muted);
    }
    
    .pagination-info strong {
        color: var(--text-secondary);
        font-weight: 600;
    }
    
    .btn-pagination {
        border-radius: 10px;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.3s ease;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-secondary);
    }
    
    .btn-pagination:not(:disabled):hover {
        box-shadow: var(--hover-shadow);
        border-color: var(--accent);
        background: var(--accent);
        color: white;
    }
    
    .btn-pagination:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: var(--bg-card-hover);
        border-color: #e2e8f0;
    }
    
    .btn-pagination i {
        font-size: 0.75rem;
    }
    
    .per-page-select {
        border-radius: 8px;
        border: 1px solid var(--border-color);
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
        transition: all 0.3s ease;
    }
    
    .per-page-select:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.15);
    }
    
    .page-number-display {
        background: var(--accent);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.875rem;
    }
    
    @media (max-width: 767.98px) {
        .pagination-container {
            padding: 0.75rem;
        }
        
        .pagination-controls {
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .btn-pagination {
            padding: 0.5rem 0.875rem;
            font-size: 0.813rem;
        }
        
        .per-page-select {
            font-size: 0.813rem;
        }
        
        .page-number-display {
            font-size: 0.813rem;
            padding: 0.4rem 0.875rem;
        }
    }
</style>

<div class="pagination-container">
    <div class="pagination-controls d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <!-- Left side: Per page selector and total count -->
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <div class="d-flex align-items-center gap-2">
                <label class="pagination-info mb-0">每页:</label>
                <select class="form-select per-page-select" style="width: auto; min-width: 70px;" 
                        onchange="changePerPage(this.value)" id="perPageSelect">
                    {% for option in per_page_options %}
                    <option value="{{ option }}" {{ 'selected' if per_page == option else '' }}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <span class="pagination-info">
                共 <strong>{{ total_items }}</strong> 条
            </span>
        </div>
        
        <!-- Right side: Navigation buttons and page info -->
        <div class="d-flex align-items-center gap-2 flex-wrap justify-content-center">
            <span class="page-number-display">
                {{ current_page }}/{{ total_pages }}
            </span>
            
            <button class="btn btn-pagination" 
                    onclick="goToPage({{ current_page - 1 }})"
                    {{ 'disabled' if current_page <= 1 else '' }}>
                <i class="fa-solid fa-chevron-left me-1"></i>上一页
            </button>
            
            <button class="btn btn-pagination" 
                    onclick="goToPage({{ current_page + 1 }})"
                    {{ 'disabled' if current_page >= total_pages else '' }}>
                下一页<i class="fa-solid fa-chevron-right ms-1"></i>
            </button>
        </div>
    </div>
</div>

<script>
    // Use IIFE to avoid polluting global scope
    (function() {
        // Pagination functions - assigned to window for onclick handlers
        // Note: These will be overwritten if pagination macro is used multiple times,
        // but that's acceptable as all pagination controls navigate to the same page
        window.goToPage = function(page) {
            // Remove hardcoded limit - let the server handle validation
            if (page < 1) return;
            const params = new URLSearchParams(window.location.search);
            params.set('{{ page_name }}', page);
            window.location.search = params.toString();
        };
        
        window.changePerPage = function(perPage) {
            const params = new URLSearchParams(window.location.search);
            params.set('per_page', perPage);
            params.set('{{ page_name }}', 1); // Reset to first page
            window.location.search = params.toString();
        };
        
        // Initialize search input from URL parameter
        window.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                const searchValue = params.get('search') || '';
                searchInput.value = searchValue;
            }
        });
    })();
</script>
{% endmacro %}
