<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>报告</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: var(--tg-theme-bg-color, #f5f7f9);
            --bg-card: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-primary: var(--tg-theme-text-color, #1e293b);
            --text-secondary: var(--tg-theme-hint-color, #475569);
            --accent: var(--tg-theme-button-color, #3b82f6);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --border-color: #e2e8f0;
        }
        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
        }
        .wrap { max-width: 560px; margin: 0 auto; padding: 12px 12px 32px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .btn-accent {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            width: 100%;
            border-radius: 10px;
            padding: .75rem 1rem;
            font-weight: 600;
        }
        .btn-accent:disabled { opacity: .6; }
        .muted { color: var(--text-secondary); font-size: .9rem; }
        .q-label { font-weight: 600; margin-bottom: .35rem; }
        .preview-img { max-width: 100%; border-radius: 8px; }
        .gate { text-align: center; padding: 3rem 1rem; }
        #toast {
            display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            background: #1e293b; color: #fff; padding: .6rem 1rem; border-radius: 8px; z-index: 20; max-width: 90%;
        }
        .view-header { margin-bottom: .75rem; }
        .view-title { margin: 0 0 .35rem; font-size: 1.05rem; }
        .contact-line {
            display: flex; align-items: baseline; flex-wrap: wrap; gap: .25rem .4rem;
            margin: 0 0 .2rem; font-size: .95rem;
        }
        .contact-label { color: var(--text-secondary); font-size: .8rem; }
        .contact-name { color: var(--accent); text-decoration: none; font-weight: 600; }
        .contact-id { color: var(--text-secondary); font-size: .8rem; font-variant-numeric: tabular-nums; }
        .view-meta { margin: 0 0 .55rem; font-size: .8rem; }
        .sort-bar { display: flex; gap: .4rem; margin: 0 0 .7rem; }
        .sort-btn {
            flex: 1; min-height: 36px; border-radius: 999px;
            border: 1px solid var(--border-color); background: var(--bg-card);
            color: var(--text-primary); font-size: .85rem;
        }
        .sort-btn.is-active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
        .report-list { display: flex; flex-direction: column; gap: .55rem; }
        .report-card {
            text-align: left; width: 100%; padding: .7rem .8rem; margin: 0;
            color: inherit; cursor: pointer;
        }
        .report-title {
            font-weight: 650; font-size: 1rem; line-height: 1.3;
            overflow-wrap: anywhere; word-break: break-word;
        }
        .report-meta {
            display: flex; justify-content: space-between; align-items: center;
            gap: .5rem; margin-top: .2rem; color: var(--text-secondary); font-size: .78rem;
        }
        .report-id { font-size: .75rem; opacity: .8; font-variant-numeric: tabular-nums; }
        .report-summary {
            margin-top: .28rem; color: var(--text-secondary); font-size: .86rem; line-height: 1.4;
            white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .empty-state, .error-text { padding: 1rem .9rem; }
        .pager { display: flex; gap: .5rem; margin-top: .8rem; }
        .pager-btn, .back-btn, .channel-link {
            min-height: 44px; display: flex; align-items: center; justify-content: center;
        }
        .pager-btn { flex: 1; }
        .back-btn { width: 100%; margin-bottom: .7rem; }
        .detail-card { padding: .75rem .85rem 1rem; }
        .detail-title {
            margin: 0; font-size: 1.02rem; line-height: 1.3;
            overflow-wrap: anywhere; word-break: break-word;
        }
        .detail-meta {
            display: flex; justify-content: space-between; gap: .5rem;
            margin: .3rem 0 .55rem; color: var(--text-secondary); font-size: .8rem;
        }
        .qa-list { display: flex; flex-direction: column; }
        .qa-item {
            padding: .55rem 0; border-top: 1px solid var(--border-color);
        }
        .qa-item:first-child { border-top: none; padding-top: .15rem; }
        .qa-question { color: var(--text-secondary); font-size: .78rem; margin: 0 0 .2rem; font-weight: 500; }
        .qa-answer {
            margin: 0; font-size: .95rem; line-height: 1.45;
            white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
        }
        .channel-link {
            display: flex; margin-top: .7rem; border-radius: 10px;
            background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-dark: var(--tg-theme-bg-color, #0e1621);
                --bg-card: var(--tg-theme-secondary-bg-color, #17212b);
                --text-primary: var(--tg-theme-text-color, #e8eef3);
                --text-secondary: var(--tg-theme-hint-color, #8b9aab);
                --border-color: rgba(255,255,255,.12);
            }
        }
        body.tg-dark {
            --bg-dark: var(--tg-theme-bg-color, #0e1621);
            --bg-card: var(--tg-theme-secondary-bg-color, #17212b);
            --text-primary: var(--tg-theme-text-color, #e8eef3);
            --text-secondary: var(--tg-theme-hint-color, #8b9aab);
            --border-color: rgba(255,255,255,.12);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div id="gate" class="gate d-none">
        <h5 class="mb-3">请从机器人打开</h5>
        <p class="muted mb-0">此页面只能在 Telegram 里通过本机器人的按钮打开，不能在普通浏览器中查看或提交报告。</p>
    </div>
    <div id="loading" class="text-center py-5 muted">正在验证身份…</div>
    <div id="app" class="d-none"></div>
</div>
<div id="toast"></div>
<script>
{% include "report_webapp_view.js" %}
</script>
<script>
(function () {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
        if (tg.colorScheme === 'dark') document.body.classList.add('tg-dark');
    }
    const startToken = new URLSearchParams(location.search).get('s') || '';
    const gate = document.getElementById('gate');
    const loading = document.getElementById('loading');
    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let session = null;
    let boot = null;
    let viewState = { page: 1, sort: 'newest' };
    let uploadToken = '';
    let submitting = false;
    let previewFileUrl = '';

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        setTimeout(() => { toastEl.style.display = 'none'; }, 2800);
    }
    function showGate() {
        loading.classList.add('d-none');
        app.classList.add('d-none');
        gate.classList.remove('d-none');
    }
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
    function headers(extra) {
        const h = Object.assign({ 'Authorization': 'Bearer ' + session.token }, extra || {});
        if (session.csrf) h['X-CSRF-Token'] = session.csrf;
        return h;
    }

    async function init() {
        const initData = (tg && tg.initData) ? tg.initData : '';
        if (!initData || !startToken) { showGate(); return; }
        try {
            const res = await fetch('/report/api/session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData: initData, startToken: startToken })
            });
            const data = await res.json();
            if (!data.ok) { toast(data.error || '校验失败'); showGate(); return; }
            session = data;
            const bootRes = await fetch('/report/api/bootstrap', { headers: headers() });
            boot = await bootRes.json();
            if (!boot.ok) { toast(boot.error || '加载失败'); showGate(); return; }
            loading.classList.add('d-none');
            app.classList.remove('d-none');
            if (session.mode === 'view') { rememberViewState(boot); renderView(); } else renderWrite();
        } catch (e) {
            toast('网络错误，请从机器人重新打开。');
            showGate();
        }
    }

    function rememberViewState(data) {
        viewState.page = data && data.page ? data.page : 1;
        viewState.sort = data && data.sort === 'oldest' ? 'oldest' : 'newest';
    }

    function renderView() {
        ReportWebAppView.renderView(app, boot, {
            openDetail: openReportDetail,
            loadPage: loadViewPage,
            onSort: function (sort) {
                if (sort === (boot && boot.sort)) return;
                loadViewPage(1, sort);
            }
        });
    }

    async function openReportDetail(id) {
        ReportWebAppView.renderLoading(app, '正在加载报告…');
        try {
            const response = await fetch('/report/api/reports/' + encodeURIComponent(id), {headers: headers()});
            const data = await response.json();
            if (!data.ok) throw new Error(data.error || '报告加载失败');
            ReportWebAppView.renderDetail(app, boot, data.report, { back: function () { loadViewPage(viewState.page, viewState.sort); } });
        } catch (error) {
            ReportWebAppView.renderDetailError(app, error.message || '网络错误，请重试', { back: function () { loadViewPage(viewState.page, viewState.sort); } });
        }
    }

    async function loadViewPage(page, sort) {
        const nextSort = sort || viewState.sort || 'newest';
        try {
            const res = await fetch('/report/api/bootstrap?page=' + encodeURIComponent(page) + '&sort=' + encodeURIComponent(nextSort), {headers: headers()});
            const data = await res.json();
            if (!data.ok) { toast(data.error || '加载失败'); return; }
            boot = data;
            rememberViewState(boot);
            renderView();
        } catch (e) { toast('网络错误，请重试'); }
    }

    function renderWrite(preview) {
        if (boot.already_submitted) {
            app.innerHTML = '<div class="card p-4 text-center"><h5>报告已提交</h5><p class="muted mb-0">编号 #' + esc(boot.submitted_report_id) + '，请勿重复提交。</p></div>';
            return;
        }
        const qs = boot.questions || [];
        let html = '<h5 class="mb-1">写报告</h5><p class="muted">单题最多4000字。含照片时完整审核稿（问题、答案、身份和后台模板）合计不得超过1024字，无照片4096字；超长会在保存前明确拒绝，不截断。动图仅使用第一帧。</p>';
        html += '<p class="muted">被提交人：' + esc(boot.target_identity) + '</p>';
        if (!preview) {
            html += '<div class="card p-3 mb-3">';
            qs.forEach((q, i) => {
                html += '<div class="mb-3"><div class="q-label">' + esc(q.text) + (q.required ? ' <span class="text-danger">*</span>' : '') + '</div>';
                if (q.hint) html += '<div class="muted mb-1">' + esc(q.hint) + '</div>';
                html += '<textarea class="form-control" id="ans_' + i + '" rows="3" maxlength="4000"></textarea></div>';
            });
            html += '<div class="mb-2"><div class="q-label">照片' + (boot.require_photo ? ' <span class="text-danger">*</span>' : '（选填）') + '</div>';
            html += '<div class="muted mb-1">' + esc(boot.photo_prompt || '') + '</div>';
            html += '<input type="file" id="photo" class="form-control" accept="image/*"></div>';
            html += '<div id="photoPreview" class="mt-2"></div>';
            html += '</div>';
            html += '<button class="btn-accent" id="toPreview">预览并确认</button>';
        } else {
            html += '<div class="card p-3 mb-3">';
            preview.answers.forEach(a => {
                html += '<div class="mb-3"><div class="q-label">' + esc(a.question) + '</div><div>' + esc(a.answer) + '</div></div>';
            });
            if (previewFileUrl) html += '<img class="preview-img mb-2" alt="预览" src="' + previewFileUrl + '">';
            html += '</div>';
            html += '<button class="btn-accent mb-2" id="doSubmit">确认提交</button>';
            html += '<button type="button" class="btn btn-outline-secondary w-100" id="backEdit">返回修改</button>';
        }
        app.innerHTML = html;
        if (!preview) {
            const fileInput = document.getElementById('photo');
            fileInput.addEventListener('change', onPickPhoto);
            document.getElementById('toPreview').addEventListener('click', goPreview);
        } else {
            document.getElementById('doSubmit').addEventListener('click', doSubmit);
            document.getElementById('backEdit').addEventListener('click', () => renderWrite(false));
        }
    }

    async function onPickPhoto(ev) {
        const file = ev.target.files && ev.target.files[0];
        uploadToken = '';
        const box = document.getElementById('photoPreview');
        if (!file) { box.innerHTML = ''; return; }
        if (file.size > 10 * 1024 * 1024) { toast('图片不能超过 10 MB'); ev.target.value = ''; return; }
        const fd = new FormData();
        fd.append('photo', file);
        box.innerHTML = '<div class="muted">正在上传…</div>';
        try {
            const res = await fetch('/report/api/upload', { method: 'POST', headers: headers(), body: fd });
            const data = await res.json();
            if (!data.ok) { toast(data.error || '上传失败'); box.innerHTML = ''; ev.target.value = ''; return; }
            uploadToken = data.upload_token;
            if (previewFileUrl) URL.revokeObjectURL(previewFileUrl);
            previewFileUrl = URL.createObjectURL(file);
            box.innerHTML = '<img class="preview-img" alt="预览" src="' + previewFileUrl + '"><div class="muted mt-1">已上传，提交时才会发给审核群。</div>';
        } catch (e) {
            toast('上传失败，请重试');
            box.innerHTML = '';
        }
    }

    function collectAnswers() {
        return (boot.questions || []).map((_, i) => {
            const el = document.getElementById('ans_' + i);
            return el ? el.value : '';
        });
    }

    function goPreview() {
        const raw = collectAnswers();
        const answers = (boot.questions || []).map((q, i) => ({ question: q.text, answer: (raw[i] || '').trim() }));
        for (let i = 0; i < boot.questions.length; i++) {
            if (boot.questions[i].required && !answers[i].answer) {
                toast('请填写：' + boot.questions[i].text);
                return;
            }
        }
        if (boot.require_photo && !uploadToken) { toast('请先上传照片'); return; }
        window.__pendingAnswers = answers;
        renderWrite({ answers: answers });
    }

    async function doSubmit() {
        if (submitting) return;
        submitting = true;
        const btn = document.getElementById('doSubmit');
        if (btn) { btn.disabled = true; btn.textContent = '正在提交…'; }
        try {
            const res = await fetch('/report/api/submit', {
                method: 'POST',
                headers: headers({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                    answers: (window.__pendingAnswers || []).map(a => a.answer),
                    upload_token: uploadToken,
                    submit_key: session.submit_key
                })
            });
            const data = await res.json();
            if (!data.ok) {
                toast(data.error || '提交失败');
                submitting = false;
                if (btn) { btn.disabled = false; btn.textContent = '确认提交'; }
                return;
            }
            boot.already_submitted = true;
            boot.submitted_report_id = data.report_id;
            app.innerHTML = '<div class="card p-4 text-center"><h5>报告已保存</h5><p class="muted mb-0">' + esc(data.message) + '</p></div>';
            // Keep delivery status visible; do not auto-close on an undelivered report.
        } catch (e) {
            toast('网络错误，若已提示成功请勿重复提交');
            submitting = false;
            if (btn) { btn.disabled = false; btn.textContent = '确认提交'; }
        }
    }

    init();
})();
</script>
</body>
</html>
