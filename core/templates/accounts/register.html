<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .register-title {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-size: 16px;
        }
        .btn-register:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h2 class="register-title">🤖 创建账号</h2>
        
        {% if msg %}
        <div class="alert {% if success %}alert-success{% else %}alert-danger{% endif %}" role="alert">
            {{ msg|safe }}
        </div>
        {% endif %}
        
        {% if not success %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">邮箱</label>
                {{ form.email }}
            </div>
            <div class="mb-3">
                <label for="password1" class="form-label">密码</label>
                {{ form.password1 }}
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label">确认密码</label>
                {{ form.password2 }}
            </div>
            <button type="submit" class="btn btn-primary btn-register w-100">注册</button>
        </form>
        {% endif %}
        
        <div class="text-center mt-3">
            <a href="{% url 'login' %}">已有账号？登录</a>
        </div>
    </div>
</body>
</html>
