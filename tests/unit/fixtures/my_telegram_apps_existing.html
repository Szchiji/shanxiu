<!DOCTYPE html>
<html><head><title>App configuration</title></head>
<body>
<div class="container"><h2>App configuration</h2>
<form class="form-horizontal" id="app_edit_form" role="form">
<input type="hidden" name="hash" value="9f8e7d6c5b4a3210"/>
<h4>App api_id and App api_hash</h4>
<div class="form-group">
  <label for="app_id" class="col-md-4 text-right control-label">App api_id:</label>
  <div class="col-md-7">
    <span class="form-control input-xlarge uneditable-input" onclick="this.select();"><strong>1234567</strong></span>
  </div>
</div>
<div class="form-group">
  <label for="app_hash" class="col-md-4 text-right control-label">App api_hash:</label>
  <div class="col-md-7">
    <span class="form-control input-xlarge uneditable-input" onclick="this.select();">0123456789abcdef0123456789abcdef</span>
  </div>
</div>
<div class="form-group">
  <label for="app_title" class="col-md-4 text-right control-label">App title:</label>
  <div class="col-md-7"><input type="text" class="form-control input-xlarge" id="app_title" name="app_title" value="My App"></div>
</div>
</form></div></body></html>
